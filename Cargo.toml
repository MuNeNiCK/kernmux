[workspace]
members = [
    "crates/kernmux-api",
    "crates/kernmux-client",
    "crates/kernmux-cli",
    "crates/kernmux-core",
    "crates/kernmux-daemon",
    "crates/kernmux-gateway",
    "crates/kernmux-ui-model",
    "crates/kernmux-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
bytes = "=1.12.1"
fdt = "=0.1.5"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
jiff = "=0.2.35"
kernmux-api = { path = "crates/kernmux-api" }
kernmux-client = { path = "crates/kernmux-client" }
kernmux-core = { path = "crates/kernmux-core" }
kernmux-ui-model = { path = "crates/kernmux-ui-model" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
rustix = { version = "=1.1.4", features = ["fs", "net", "process"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
