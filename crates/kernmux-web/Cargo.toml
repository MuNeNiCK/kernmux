[package]
name = "kernmux-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
web = []

[dependencies]
kernmux-api.workspace = true
kernmux-ui-model.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "399258feeaf90ad8a3a208c99221ee87b6452f38" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "399258feeaf90ad8a3a208c99221ee87b6452f38" }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
js-sys = "=0.3.103"
serde_json.workspace = true
serde.workspace = true
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = [
  "Event",
  "Headers",
  "History",
  "Location",
  "MediaQueryList",
  "Request",
  "RequestInit",
  "Response",
  "Window",
] }

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]
